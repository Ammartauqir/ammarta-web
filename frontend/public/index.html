      try {
        if (localStorage.getItem("theme") !== "light") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (_) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <meta
      name="description"
      content="Ammar Tauqir — software engineer exploring perception, robotics, and useful AI. Projects, research interests, and engineering notes."
    />
